openapi: 3.0.3
info:
  title: Tranquilo API
  description: >-
    Vercel Serverless Functions backing tranquilo.art. Every function under
    api/ is documented here (public routes and internal Vercel Cron
    endpoints alike) -- see CONVENTIONS.md for why these stay one file per
    route rather than a framework. Kept in sync by hand as routes change;
    treat a mismatch as this file being stale, not the handler. The locale
    and translation contract (`x-supported-locales`,
    `x-translatable-fields`, `Translated`) is checked against the code by
    tests/openapi-locale-contract.test.ts.
  version: "1.0.0"
  license:
    name: UNLICENSED
servers:
  - url: https://tranquilo.art
    description: Production
security: []
tags:
  - name: catalogue
    description: The live art catalogue and its derived facets/search
  - name: sharing
    description: Per-artwork/per-storyline/per-shelf share pages and preview images
  - name: engagement
    description: Analytics, waitlists, feedback and collection submissions
  - name: cron
    description: >-
      Vercel Cron-triggered maintenance. Not meant to be called directly --
      every one of these requires the CRON_SECRET bearer token Vercel's own
      dispatcher sends, documented here for completeness rather than as an
      invitation to call them by hand.

paths:
  /api/items:
    get:
      tags: [catalogue]
      summary: Query the catalogue
      operationId: getItems
      description: >-
        One endpoint for every shape of "what's in the catalogue" question:
        a shuffled page of the lightweight order manifest, an explicit id
        lookup, a count, or one of the bounded aggregates
        (facets/suggest/correction). Full item rows are served only by `keys`
        or `ids` lookups. A request that is neither a lookup, a shuffled
        manifest page, a count, nor one of the other shapes is a 400.
      parameters:
        - name: shape
          in: query
          description: >-
            Selects a whole-catalogue aggregate or the order manifest
            instead of a page of full rows. `manifest` returns a page of
            live items' identity/facets and requires `order=shuffle`;
            `facets`/`suggest`/`correction` return
            answers bounded by distinct-value count, not catalogue size;
            `storylines`/`storyline`/`shelves`/`music`/`heroes` dispatch to a
            different table entirely (see below) and take no other
            catalogue filter. `print_region` returns the visitor's
            country (from the request's geolocation) and the print-on-demand
            region it belongs to, as `{ country, region }`, either of which
            may be null; it is never cached at the edge. `vocabulary` lists
            every controlled-vocabulary value with its display label in the
            requested `locale` (English without one) and takes no other
            parameter; see `VocabularyLabels`. `detail` returns one item's
            curated text (caption, grounding sources, cast, plot twist) and
            requires `key`; see `ItemDetail`. It has a per-visitor request
            budget of its own, apart from the page budget. `print_quote`
            returns the price and approximate delivery of one print for an
            artwork shipped to a country, as `{ available, total, item,
            delivery, currency, minDays, maxDays, madeIn }`, or
            `{ available: false }` where it cannot be delivered. It requires
            `key`, `product` and `country`, has a per-visitor request budget
            of its own, and is never cached at the edge.
          schema:
            type: string
            enum: [manifest, facets, suggest, correction, count, storylines, storyline, shelves, music, heroes, print_region, print_quote, vocabulary, detail]
        - name: keys
          in: query
          description: >-
            Repeated `source:native_id` params (`?keys=met:1&keys=npm:U:15646`),
            split on the first colon -- native ids may contain one. Resolves
            exactly these items regardless of any other filter; short-circuits
            everything else in this list. Native ids repeat across sources,
            so this is the lookup to use when the source is known. Max 100
            per request; not combinable with `ids`.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: ids
          in: query
          description: >-
            Repeated params (`?ids=a&ids=b`), never comma-joined -- some
            native ids contain a literal comma. Resolves every live item
            with these native ids, from any source, regardless of any other
            filter; short-circuits everything else in this list. Max 100
            per request.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: key
          in: query
          description: >-
            Required with `shape=detail` and `shape=print_quote` -- one
            `source:native_id`, split on the first colon.
          schema: { type: string }
        - name: product
          in: query
          description: Required with `shape=print_quote`.
          schema:
            type: string
            enum: [mini_print, poster, framed, tote, mug]
        - name: country
          in: query
          description: >-
            Required with `shape=print_quote` -- a two-letter country code.
          schema: { type: string }
        - name: id
          in: query
          description: Required with `shape=storyline` -- the storyline id to fetch.
          schema: { type: string }
        - name: q
          in: query
          description: >-
            Free-text search (title/artist/medium/tags/bio/date/place of
            production,
            diacritic-folded substring match) when used as a filter, or the
            partial query being autocompleted when combined with
            `shape=suggest`/`shape=correction`.
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: timeframe
          in: query
          schema: { type: string }
        - name: palette
          in: query
          schema: { type: string }
        - name: media_type
          in: query
          schema: { type: string }
        - name: region_primary
          in: query
          description: Also matches items whose `region_alt` array contains this value.
          schema: { type: string }
        - name: source
          in: query
          schema:
            type: string
            enum: [met, smithsonian, cleveland, commons, europeana, npm, wellcome, nga, tepapa, mia, aic, tainacan]
        - name: subject_type
          in: query
          schema: { type: string }
        - name: artist
          in: query
          description: Exact match, not substring -- clicking an artist name, not searching one.
          schema: { type: string }
        - name: has_storyline
          in: query
          description: '`1` to filter to items that belong to at least one storyline.'
          schema: { type: string, enum: ["1"] }
        - name: order
          in: query
          description: '`shuffle` requests the precomputed globally-random feed order (requires `start` or `cursor`).'
          schema: { type: string, enum: [shuffle] }
        - name: start
          in: query
          description: 'Shuffle session''s starting offset in [0,1) -- required on the first `order=shuffle` request, ignored once a `cursor` is supplied.'
          schema: { type: number }
        - name: limit
          in: query
          description: Manifest page size. Default 60, max 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
        - name: cursor
          in: query
          description: >-
            Opaque continuation token from a previous page's `next_cursor`.
          schema: { type: string }
        - name: locale
          in: query
          description: >-
            Language to return content in, as one of `x-supported-locales`
            (e.g. "pt-BR"), matched case-insensitively; an unknown code is a
            400. `Accept-Language` is not read, so a response depends only on
            the URL. Without `locale`, no field is translated.


            Applies to item rows (full and manifest), `shape=storyline` and
            `shape=shelves`. An item's translatable fields are listed under
            `x-translatable-fields` on `Item`. A field is replaced only by a
            human-reviewed translation (or the source's own text in that
            language) of its current text, trying the requested locale and
            then English; machine drafts are never served, and a translation
            of text that has since changed is hidden, not served stale. Every
            replaced field is listed under the object's `translated`.


            `medium`, `culture`, `place_of_origin`, `artist_nationality` and
            `tags` are translated per term: one reviewed translation of a
            term applies to every item that uses it, following the item's own
            capitalization. `tags` is translated per comma-separated tag, and
            a tag without a translation keeps its source text. A translation
            written for one item wins over a term's.


            Source text is as supplied by the institution, in whatever
            language that is, and there is no per-item source-language
            field. A request for `en` can therefore return Portuguese for a
            Portuguese-source item until an English translation exists.


            With `q`, a `locale` request also matches that locale's reviewed
            translations of `medium`, `tags` and `place_of_origin`, in
            addition to source text. With `shape=suggest` and
            `shape=correction`, it also offers them, in place of a source
            medium or tag that has one.


            Adding a locale, a translatable field or a `translated` key is
            not a breaking change; removing or renaming one is.
          schema: { type: string }
          x-supported-locales: [en, pt-BR]
        - name: coverage
          in: query
          description: >-
            `1`, with `shape=facets` and a `locale`, adds `translation` to the
            facets answer: for each translatable field, how many live items
            have a value and how many of those are served translated in that
            locale. Without a `locale` it is a 400. Counts the requested
            locale only, not the English fallback, and uses the rules
            `locale` serves under (a reviewed term or an approved translation
            of the current text; for `tags`, every tag translated). A field
            the source already supplies in that language counts as not
            translated.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: >-
            Shape depends on the request -- see the response schemas below
            (page, manifest page, aggregate, or lookup-with-missing).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ItemLookupResult"
                  - $ref: "#/components/schemas/ShuffledManifestPage"
                  - $ref: "#/components/schemas/FacetsResult"
                  - $ref: "#/components/schemas/SuggestResult"
                  - $ref: "#/components/schemas/CorrectionResult"
                  - $ref: "#/components/schemas/CountResult"
                  - $ref: "#/components/schemas/VocabularyLabels"
                  - $ref: "#/components/schemas/ItemDetailResult"
                  - $ref: "#/components/schemas/StorylineIndexEntry"
                  - $ref: "#/components/schemas/Storyline"
                  - type: array
                    items: { $ref: "#/components/schemas/Shelf" }
                  - $ref: "#/components/schemas/MusicBucketsResult"
                  - type: array
                    items: { $ref: "#/components/schemas/HeroPoolEntry" }
        "400":
          description: >-
            Caller error -- a malformed or too-large `keys` or `ids` list,
            both given at once, a malformed cursor, an out-of-range `start`,
            an unwhitelisted facet, a full-row request that is not a
            lookup, or `shape=manifest`
            without `order=shuffle`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "404":
          description: '`shape=storyline` with an `id` that doesn''t exist, or `shape=detail` with a `key` that is not a live item.'
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "500":
          description: DATABASE_URL not configured, or the query itself failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /v1/items:
    get:
      tags: [catalogue]
      summary: Query the catalogue with an API key
      operationId: getKeyedItems
      security: [{ apiKey: [] }]
      description: >-
        The keyed tier of `/api/items`: the same query parameters and shapes
        for catalogue queries (lookups, pages, manifest, facets, suggest,
        correction, count, detail), answered under a per-key quota instead of
        the per-visitor budget. Full item rows carry an extra `keyed` object.
        Responses are never cached (`Cache-Control: private, no-store`).
        Shapes that are not catalogue queries (`storylines`, `storyline`,
        `set_of_works`, `set_of_work`, `shelves`, `music`, `heroes`,
        `vocabulary`, `print_region`) are a 400; use `/api/items` for those.
        Keys are issued by hand; send one as `Authorization: Bearer <key>`.
      responses:
        "200":
          description: Same shapes as `/api/items`, with `keyed` on full item rows.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/KeyedItemLookupResult"
                  - $ref: "#/components/schemas/ShuffledManifestPage"
                  - $ref: "#/components/schemas/FacetsResult"
                  - $ref: "#/components/schemas/SuggestResult"
                  - $ref: "#/components/schemas/CorrectionResult"
                  - $ref: "#/components/schemas/CountResult"
                  - $ref: "#/components/schemas/ItemDetailResult"
        "400":
          description: Caller error, as for `/api/items`, or a shape with no keyed form.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "401":
          description: Missing, unknown or revoked key.
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "404":
          description: '`shape=detail` with a `key` that is not a live item.'
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429":
          description: The key's quota is spent. `Retry-After` gives seconds.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: >-
            The key or its quota could not be checked. The keyed tier fails
            closed rather than serving unmetered.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/track:
    post:
      tags: [engagement]
      summary: Record an analytics event
      operationId: trackEvent
      description: >-
        Fire-and-forget sink for the client's own trackEvent() calls (see
        src/app.ts). The client ignores the response either way; this
        exists so events are durable past Vercel's 1-hour runtime log
        window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_name]
              properties:
                event_name: { type: string }
                props:
                  type: object
                  description: Arbitrary JSON-serializable event properties.
                  additionalProperties: true
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400":
          description: Missing/invalid `event_name`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: DATABASE_URL not configured, or the insert failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/subscribe:
    post:
      tags: [engagement]
      summary: Add an email to a Resend audience
      operationId: subscribe
      description: >-
        One capture endpoint for every "leave your email" entry point (Tranquilo Curator
        waitlist, feature-notify, newsletter opt-in, homepage newsletter),
        distinguished by
        `source`. Re-subscribing under a second source merges into a
        comma-separated `source` property rather than overwriting the
        first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, source]
              properties:
                email: { type: string, format: email }
                source:
                  type: string
                  enum: [pro_waitlist, feature_notify, newsletter_submit, homepage_newsletter]
                locale:
                  $ref: "#/components/schemas/RequestLocale"
      responses:
        "200":
          description: Subscribed (or already subscribed -- this call is idempotent).
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400":
          description: Invalid email or unrecognized `source`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: RESEND_API_KEY not configured, or an unexpected error.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "502":
          description: Resend's API rejected the request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/submit-collection:
    post:
      tags: [engagement]
      summary: Submit a collection, or send feedback
      operationId: submitCollectionOrFeedback
      description: >-
        Two unrelated forms share this one route (pages/submit.html's
        "submit a collection" form, and the site-wide feedback form) purely
        because Vercel Hobby caps the project at 12 functions -- see the
        `kind` discriminator. Both send an email via Resend; neither
        persists anything server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CollectionSubmission"
                - $ref: "#/components/schemas/FeedbackSubmission"
      responses:
        "200":
          description: Email sent.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400":
          description: A required field is missing, too long, or malformed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: RESEND_API_KEY/SUBMIT_NOTIFY_EMAIL not configured, or an unexpected error.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "502":
          description: Resend's API rejected the request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/webhooks/resend:
    post:
      tags: [engagement]
      summary: Resend delivery-failure webhook
      operationId: resendWebhook
      description: >-
        Registered in Resend's dashboard (RESEND_WEBHOOK_SECRET), not
        called by this site's own client. Signature-verified via Svix
        (svix-id/svix-timestamp/svix-signature headers) against the raw
        request body. On a bounce/delay/complaint, emails the ops inbox
        (a failed send returns 500 so Resend retries); every other event
        type is acknowledged and ignored.
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: Raw Resend/Svix event payload -- passed through to Svix's verifier unparsed.
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Event acknowledged (and, for an alert-worthy type, processed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  handled:
                    type: boolean
                    description: false for a non-alert-worthy event type (delivered/sent/opened/clicked).
        "401":
          description: Svix signature verification failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: RESEND_WEBHOOK_SECRET not configured, or alert delivery failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/webhooks/patreon:
    post:
      tags: [engagement]
      summary: Patreon member webhook
      operationId: patreonWebhook
      description: >-
        Registered in Patreon's developer portal (PATREON_WEBHOOK_SECRET),
        not called by this site's own client. X-Patreon-Signature is the hex
        HMAC-MD5 of the raw body. On a members:* or members:pledge:* event,
        stores the member's name, status and tiers for the About page's
        patron list; members:delete blanks the stored name. Every other
        event type is acknowledged and ignored.
      parameters:
        - name: X-Patreon-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-Patreon-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: Raw Patreon JSON:API payload whose `data` is a member resource.
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Event acknowledged (and, for a member event, stored).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  handled:
                    type: boolean
                    description: false for an event type other than members:*.
        "400":
          description: Unreadable body, or not a member resource.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "401":
          description: Signature verification failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: PATREON_WEBHOOK_SECRET not configured, or the database write failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /v/{slug}:
    get:
      tags: [sharing]
      summary: Per-artwork, per-storyline or per-shelf share page
      operationId: getSharePage
      description: >-
        Rewritten from `/v/:slug` (vercel.json) to `/api/v/[slug]`. Serves
        the real app shell (index.html) with this item's/storyline's own
        `<meta>`/OpenGraph/Twitter Card tags injected in place -- a crawler
        sees a fully-formed preview, a human gets the real running app at a
        real, bookmarkable URL. `/s/{id}` (a storyline) rewrites here too,
        as slug `s-{id}`, and `/shelf/{slug}` (a Discover shelf) as slug
        `shelf-{slug}`.
      parameters:
        - name: slug
          in: path
          required: true
          description: '`{source}-{nativeId}` for an artwork (split on the first hyphen only), `s-{storylineId}` for a storyline, or `shelf-{shelfSlug}` for a shelf (its title slug, or its id for older links).'
          schema: { type: string }
      responses:
        "200":
          description: HTML page (the app shell with injected meta tags), or a not-found stub if the slug doesn't resolve.
          content:
            text/html: { schema: { type: string } }

  /s/{id}:
    get:
      tags: [sharing]
      summary: Storyline share page (alias)
      operationId: getStorylineSharePageAlias
      description: Rewrites to `/v/s-{id}` -- see `/v/{slug}`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: See `/v/{slug}`.
          content:
            text/html: { schema: { type: string } }

  /shelf/{slug}:
    get:
      tags: [sharing]
      summary: Shelf share page (alias)
      operationId: getShelfSharePageAlias
      description: Rewrites to `/v/shelf-{slug}` -- see `/v/{slug}`. Accepts the shelf's title slug, or its id for older links.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: See `/v/{slug}`.
          content:
            text/html: { schema: { type: string } }

  /og/{slug}.png:
    get:
      tags: [sharing]
      summary: Generated share-preview image (1200x630)
      operationId: getSharePreviewImage
      description: >-
        Rewritten from `/og/:slug.png` to `/api/og/[slug]`. Renders a PNG
        card via @vercel/og (Satori) -- the artwork's own image tinted with
        its accent color, or a title/caption-only card if the source is
        under a health hold or the image fetch fails. `slug` matching
        `s-{id}` renders the storyline variant instead, and `shelf-{slug}`
        the shelf variant (title, work count, one cover image).
      parameters:
        - name: slug
          in: path
          required: true
          description: '`{source}-{nativeId}`, `s-{storylineId}` for a storyline card, or `shelf-{shelfSlug}` for a shelf card. The `.png` suffix is stripped by the rewrite.'
          schema: { type: string }
      responses:
        "200":
          description: PNG image, 1200x630.
          content:
            image/png: { schema: { type: string, format: binary } }
        "500":
          description: Card generation failed unexpectedly.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /sitemap.xml:
    get:
      tags: [sharing]
      summary: Sitemap of every live artwork and static page
      operationId: getSitemap
      description: >-
        Generated per-request (rewritten from `/sitemap.xml` to
        `/api/sitemap`) rather than checked in, since the catalogue changes
        without a deploy. Quarantined/rejected items are never listed.
      responses:
        "200":
          description: Sitemap XML.
          content:
            application/xml: { schema: { type: string } }
        "500":
          description: DATABASE_URL not configured, or the query failed.
          content:
            text/plain: { schema: { type: string } }

  /img/{source}/{id}/{tier}:
    get:
      tags: [catalogue]
      summary: Cached/resized image proxy
      operationId: getProxiedImage
      description: >-
        Rewritten from `/img/:source/:id/:tier` to
        `/api/img/[source]/[id]/[tier]`. Every feed/lightbox image request
        for a live item goes through here rather than hotlinking the
        source institution directly. On a cache hit this 302s straight to
        the cached Vercel Blob object with no bytes touching the function;
        on a miss it may fetch, transform (resize + WebP re-encode) and
        cache the origin image, or -- under admission control, a rate-limit
        hold, or the storage circuit breaker -- "shed" the request (redirect
        to origin for `display`, fall back to the cached `display` blob for
        `lightbox`, or 503).
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [met, smithsonian, cleveland, commons, europeana, npm, wellcome, nga, tepapa, mia, aic, tainacan]
        - name: id
          in: path
          required: true
          description: The item's native id (source-specific format).
          schema: { type: string }
        - name: tier
          in: path
          required: true
          schema: { type: string, enum: [display, lightbox] }
      responses:
        "302":
          description: >-
            Redirect to the cached Blob object, the source origin (a
            shed `display` request), or a degraded cached `display`
            fallback (a shed `lightbox` request). See the `X-Tranquilo-Shed`
            response header for why, when present.
          headers:
            Location: { schema: { type: string } }
            X-Tranquilo-Shed:
              description: Present only on a shed response -- the reason (e.g. `not-admitted-3`, `origin-429`, `in-flight`).
              schema: { type: string }
        "200":
          description: >-
            Image bytes served directly (an un-admitted or breaker-tripped
            write that still had the transformed buffer in memory).
          content:
            image/webp: { schema: { type: string, format: binary } }
        "400":
          description: Missing/invalid `source`/`id`/`tier`, or the item's stored image URL isn't on an allowlisted host.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "404":
          description: An uncached image for an item that doesn't exist or isn't live.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "502":
          description: The origin fetch failed and no fallback was available.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: Temporarily unavailable -- no cached fallback exists for a shed lightbox request.
          headers:
            Retry-After: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/cron/health-check:
    get:
      tags: [cron]
      summary: Daily threshold check (Neon size, Blob usage, per-source image health)
      operationId: cronHealthCheck
      description: >-
        Vercel Cron only (see vercel.json's `crons`) -- silent on a healthy
        run, emails the maintainer on a threshold breach. `?op=` also
        exposes hand-triggered Blob-cache maintenance operations, dry-run
        by default.
      security: [{ cronSecret: [] }]
      parameters:
        - name: op
          in: query
          description: Hand-triggered maintenance instead of the scheduled health check.
          schema: { type: string, enum: [reconcile-blob, verify-eviction] }
        - name: commit
          in: query
          description: '`1` to actually write; omitted/anything else is a dry run.'
          schema: { type: string, enum: ["1"] }
        - name: cap
          in: query
          description: 'Override the soft cap (bytes) for `op=verify-eviction`.'
          schema: { type: integer }
      responses:
        "200":
          description: >-
            `{}` on a healthy scheduled run, or the `op`'s own result object
            when `?op=` was supplied.
          content:
            application/json: { schema: { type: object } }
        "401":
          $ref: "#/components/responses/CronUnauthorized"
        "500":
          description: Required env vars missing for the requested `op`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/cron/db-backup:
    get:
      tags: [cron]
      summary: Daily `items` table backup to GitHub, or a partial shuffle-key reshuffle
      operationId: cronDbBackup
      description: >-
        Vercel Cron only, two schedule entries hitting this one function
        (Vercel Hobby's 12-function cap). The plain path exports `items` to
        the `db-backups` branch; `?task=reshuffle` re-randomizes a fraction
        of `shuffle_key` and rebuilds the search vocabulary instead.
      security: [{ cronSecret: [] }]
      parameters:
        - name: task
          in: query
          schema: { type: string, enum: [reshuffle] }
      responses:
        "200":
          description: Backup written, or the reshuffle's row count.
          content:
            application/json: { schema: { type: object } }
        "401":
          $ref: "#/components/responses/CronUnauthorized"
        "500":
          description: DATABASE_URL/GITHUB_BACKUP_TOKEN not configured, or the export/GitHub API call failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /api/cron/restore-drill-reminder:
    get:
      tags: [cron]
      summary: Quarterly reminder that a database restore drill is due
      operationId: cronRestoreDrillReminder
      description: >-
        Vercel Cron only, on the first day of each quarter. Emails the
        maintainer the restore-drill checklist. A failed send returns 500
        rather than being swallowed, since the email is the only output.
      security: [{ cronSecret: [] }]
      responses:
        "200":
          description: Reminder sent.
          content:
            application/json: { schema: { type: object } }
        "401":
          $ref: "#/components/responses/CronUnauthorized"
        "500":
          description: Email not configured, or the Resend call failed.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        An API key for the keyed tier (`/v1/items`), issued by hand and shown
        once. Only a hash is stored on our side.
    cronSecret:
      type: http
      scheme: bearer
      description: >-
        Vercel's own dispatcher sends `Authorization: Bearer <CRON_SECRET>`
        when invoking a configured cron path -- this is what proves a
        request actually came from Vercel and not a public hit on a
        guessable URL. Not meant to be presented by any other caller.
  responses:
    MethodNotAllowed:
      description: Wrong HTTP method.
      headers:
        Allow: { schema: { type: string } }
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    CronUnauthorized:
      description: Missing or mismatched CRON_SECRET bearer token.
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Item:
      type: object
      description: A full catalogue row, as returned in a paged/lookup response.
      x-translatable-fields: [title, caption_tea, caption_basic, medium, culture, place_of_origin, artist_nationality, tags]
      properties:
        id: { type: string, description: "native_id" }
        translated: { $ref: "#/components/schemas/Translated" }
        source: { type: string, enum: [met, smithsonian, cleveland, commons, europeana, npm, wellcome, nga, tepapa, mia, aic, tainacan] }
        title: { type: string, nullable: true }
        artist: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        attribution_type: { type: string, nullable: true }
        artist_nationality: { type: string, nullable: true }
        artist_lifespan: { type: string, nullable: true }
        culture: { type: string, nullable: true }
        culture_period: { type: string, nullable: true }
        date: { type: string, nullable: true }
        medium: { type: string, nullable: true }
        credit: { type: string, nullable: true }
        photographer:
          type: string
          nullable: true
          description: Who photographed the work, when that's someone other than its maker (e.g. the contributor who photographed a painting). Null for most items.
        tags: { type: array, items: { type: string } }
        img:
          type: string
          description: '/img proxy URL for the display tier ("" if the item has no source image).'
        lightbox_img:
          type: string
          description: '/img proxy URL for the lightbox tier.'
        blur_placeholder: { type: string, nullable: true }
        master_width:
          type: integer
          nullable: true
          description: Pixel width of the source's largest published image. Null until measured.
        master_height:
          type: integer
          nullable: true
          description: Pixel height of the source's largest published image. Null until measured.
        url: { type: string, nullable: true, description: Outbound link to the source institution's own page. }
        license: { type: string, nullable: true }
        category: { type: string, nullable: true }
        region_primary: { type: string, nullable: true }
        region_alt: { type: array, items: { type: string } }
        place_of_origin: { type: string, nullable: true, description: "The source's own free-text place of production, as stored. Searchable via `q`; not a facet." }
        timeframe: { type: string, nullable: true }
        media_type: { type: string, nullable: true }
        palette: { type: string, nullable: true }
        subject_type: { type: string, nullable: true }
        accentColor: { type: string, nullable: true }
        contains_nudity: { type: boolean }
        caption_basic: { type: string, nullable: true }
        tea_voice_status: { type: string, nullable: true }
        cast_tier: { type: string, nullable: true }
        storyline_ids: { type: array, items: { type: string } }
        set_of_work_id: { type: string, nullable: true }
        twist_category: { type: string, nullable: true }
        twist_hook: { type: string, nullable: true }
        shuffle_key: { type: number }
    KeyedItem:
      description: An `Item` plus what the keyed tier adds.
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          properties:
            keyed:
              type: object
              description: >-
                Stored provenance values. More fields are added here over
                time; adding one is not a breaking change.
              properties:
                source_verified_at: { type: string, format: date-time, nullable: true }
                rules_version: { type: integer, nullable: true }
    KeyedItemLookupResult:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KeyedItem" }
        missing:
          type: array
          items: { type: string }
    ItemDetailResult:
      type: object
      description: '`?shape=detail&key=...` -- the curated text for one item.'
      required: [item]
      properties:
        item: { $ref: "#/components/schemas/ItemDetail" }
    ItemDetail:
      type: object
      description: >-
        The curated text of an item, served one item at a time and only by
        `?shape=detail` -- item rows carry none of it, only `cast_tier`,
        `twist_category` and `twist_hook`. `caption_tea` is translated under
        `locale` like any item row.
      properties:
        caption_tea: { type: string, nullable: true }
        tea_voice_sources:
          type: array
          nullable: true
          items:
            type: object
            properties:
              text: { type: string }
              url: { type: string }
              publication:
                type: object
                description: A book the claim draws on. Present only with a link to where a reader can get it.
                properties:
                  title: { type: string }
                  author: { type: string, nullable: true }
                  publisher: { type: string, nullable: true }
                  year: { type: integer, nullable: true }
                  pages: { type: string, nullable: true }
                  url: { type: string, description: Publisher page if in print, otherwise a library catalogue record. }
        cast: {}
        cast_context: {}
        twist_story: { type: string, nullable: true }
        twist_source_url: { type: string, nullable: true }
    ManifestItem:
      type: object
      description: The lightweight order-manifest shape (`?shape=manifest`) -- identity and facets only, no heavy text/image fields.
      properties:
        id: { type: string }
        source: { type: string }
        title: { type: string, nullable: true }
        translated: { $ref: "#/components/schemas/Translated" }
        artist: { type: string, nullable: true }
        category: { type: string, nullable: true }
        timeframe: { type: string, nullable: true }
        palette: { type: string, nullable: true }
        media_type: { type: string, nullable: true }
        region_primary: { type: string, nullable: true }
        region_alt: { type: array, items: { type: string } }
        subject_type: { type: string, nullable: true }
        storyline_ids: { type: array, items: { type: string } }
        set_of_work_id: { type: string, nullable: true }
        contains_nudity: { type: boolean }
        twist_category: { type: string, nullable: true }
        shuffle_key: { type: number }
    ItemLookupResult:
      type: object
      description: 'Response to an explicit `?keys=` or `?ids=` lookup.'
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        missing:
          type: array
          items: { type: string }
          description: Requested keys or ids, as given, that resolved to nothing (quarantined, rejected, or never existed).
    ShuffledManifestPage:
      type: object
      description: '`?shape=manifest&order=shuffle` -- a page of the manifest in shuffled order.'
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ManifestItem" } }
        next_cursor:
          type: string
          nullable: true
          description: Null once the session has seen the whole live catalogue exactly once.
    FacetsResult:
      type: object
      description: >-
        One key per facet pool this query grouped (category/source are
        pluralized to `categories`/`sources`; artist/region/era/type/color
        keep their singular facet label -- see api/items.ts's own comment on
        why a hardcoded two-pool ternary silently swept everything else into
        `sources`). `total` is always present; every other key is present
        only when that pool had at least one qualifying value.
      required: [total]
      properties:
        categories:
          type: array
          items:
            type: object
            properties: { value: { type: string }, count: { type: integer } }
        sources:
          type: array
          items:
            type: object
            properties: { value: { type: string }, count: { type: integer } }
        artist:
          type: array
          items:
            type: object
            properties: { value: { type: string }, count: { type: integer } }
        region:
          type: array
          items:
            type: object
            properties: { value: { type: string }, count: { type: integer } }
        era:
          type: array
          items:
            type: object
            properties: { value: { type: string }, count: { type: integer } }
        type:
          type: array
          items:
            type: object
            properties: { value: { type: string }, count: { type: integer } }
        color:
          type: array
          items:
            type: object
            properties: { value: { type: string }, count: { type: integer } }
        total: { type: integer }
        translation:
          type: object
          description: Only present for `coverage=1` with a `locale`.
          required: [locale, fields]
          properties:
            locale: { type: string }
            fields:
              type: object
              description: One entry per translatable field (`x-translatable-fields` on `Item`).
              additionalProperties:
                type: object
                required: [items, translated]
                properties:
                  items: { type: integer, description: Live items with a value in the field. }
                  translated: { type: integer, description: Of those, how many are served translated. }
    SuggestResult:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              type: { type: string }
              itemCount: { type: integer }
    CorrectionResult:
      type: object
      properties:
        candidates: { type: array, items: { type: string } }
    CountResult:
      type: object
      properties:
        total: { type: integer }
    VocabularyLabels:
      type: object
      description: >-
        Every controlled-vocabulary value under the filter parameter that
        takes it (`x-vocabulary-fields`), with a display label in `locale`.
        `value` is the stable code: it is what every filter and facet matches
        on, it is never translated, and it never changes with `locale`. A
        value with no label in the locale falls back to its English label,
        and `label` is never empty. Values the live catalogue holds that
        this vocabulary does not list are not included.
      x-vocabulary-fields: [category, region_primary, timeframe, media_type, palette, subject_type]
      required: [locale, fields]
      properties:
        locale: { type: string, description: The locale the labels are in. }
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [value, label]
              properties:
                value: { type: string }
                label: { type: string }
    StorylineIndexEntry:
      type: object
      description: 'One entry of `?shape=storylines`''s array response.'
      properties:
        id: { type: string }
        cover_item_id: { type: string }
        cover_source:
          type: string
          description: Source of the cover item, present where its native id is shared across sources.
        title: { type: string }
    Storyline:
      type: object
      description: 'Full record from `?shape=storyline&id=...`.'
      properties:
        id: { type: string }
        title: { type: string }
        intro_caption: { type: string }
        translated: { $ref: "#/components/schemas/Translated" }
        cover_item_id: { type: string }
        cover_source:
          type: string
          description: Source of the cover item, present where its native id is shared across sources.
        items:
          type: array
          items:
            type: object
            properties:
              item_id: { type: string }
              source:
                type: string
                description: Present where the native id is shared across sources.
              chapter_caption: { type: string, nullable: true }
              translated: { $ref: "#/components/schemas/Translated" }
    Shelf:
      type: object
      description: 'One entry of `?shape=shelves`''s array response, in Discover display order.'
      required: [id, title, type]
      properties:
        id: { type: string }
        slug:
          type: string
          description: URL form of the untranslated title, used by `/shelf/{slug}` share links.
        title: { type: string }
        translated: { $ref: "#/components/schemas/Translated" }
        type: { type: string, enum: [hero, rule] }
        itemIds:
          type: array
          description: 'Present only when `type` is `hero`. Mixed native-id shapes -- numeric ids and Commons filename strings both appear.'
          items:
            oneOf: [{ type: integer }, { type: string }]
        filter:
          type: object
          description: 'Present only when `type` is `rule` -- matched against `item[key] === value` for every key.'
          additionalProperties: true
        minItems:
          type: integer
          description: 'Present only when `type` is `rule` -- the shelf renders only once its filter currently qualifies at least this many live items.'
    MusicBucket:
      type: object
      properties:
        label: { type: string }
        category:
          type: string
          nullable: true
          description: 'Null for a bucket with no current category mapping (e.g. "asian-art").'
        track: { type: string, nullable: true, format: uri }
        credit: { type: string, nullable: true }
        creditUrl: { type: string, nullable: true, format: uri }
        license: { type: string, nullable: true }
    MusicBucketsResult:
      type: object
      description: '`?shape=music`''s response -- every bucket, keyed by its own stable bucket key (not an array).'
      additionalProperties:
        $ref: "#/components/schemas/MusicBucket"
    HeroPoolEntry:
      type: object
      description: >-
        One entry of `?shape=heroes`''s array response -- the hand-curated
        first-impression pool a first-time visitor's feed opens with (see
        src/app.ts's own header comment on hero rotation). Identifies an
        item rather than embedding it; the client resolves its final
        session pick to full item data via `?ids=`.
      required: [source, native_id, media_type]
      properties:
        source: { type: string, enum: [met, smithsonian, cleveland, commons, europeana, npm, wellcome, nga, tepapa, mia, aic, tainacan] }
        native_id: { type: string }
        media_type:
          type: string
          description: 'Read live from the joined item''s own `media_type` -- used client-side to decluster the pool so no two consecutive picks share a medium.'
    CollectionSubmission:
      type: object
      required: [collectionName, submitterName, submitterEmail, collectionLink, licenseType, licenseVerificationLink, description]
      properties:
        kind: { type: string, enum: [""], description: Omit entirely -- an absent `kind` means "collection". }
        collectionName: { type: string }
        submitterName: { type: string }
        submitterEmail: { type: string, format: email }
        collectionLink: { type: string, format: uri }
        licenseType: { type: string }
        licenseOther: { type: string, description: Required when licenseType is "Other". }
        licenseVerificationLink: { type: string, format: uri }
        description: { type: string }
        estimatedSize: { type: string }
        newsletterOptIn: { type: boolean }
        locale: { $ref: "#/components/schemas/RequestLocale" }
    FeedbackSubmission:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string, enum: [feedback] }
        message: { type: string, maxLength: 4000 }
        feedbackType: { type: string, enum: [Bug, "Feature idea", Content, "Something else"] }
        context: { type: string, maxLength: 300 }
        email: { type: string, format: email, maxLength: 200, description: Optional -- anonymous feedback is allowed. }
        locale: { $ref: "#/components/schemas/RequestLocale" }
    Translated:
      type: object
      description: >-
        Present only when `locale` replaced at least one field: one entry per
        replaced field, keyed by field name.
      additionalProperties:
        type: object
        required: [origin, locale, original]
        properties:
          origin:
            type: string
            enum: [original, human]
            description: '`original` is the source''s own text in that language; `human` is a reviewed translation.'
          locale: { type: string, description: Locale of the text now in the field. }
          original: { type: string, description: The source text it replaced. }
    RequestLocale:
      type: string
      description: >-
        Optional BCP-47 code of the language the form or signup was sent in
        (e.g. "en", "pt-BR"). Only a code from the site's locale registry is
        recorded, matched case-insensitively; anything else is ignored rather
        than rejected. On /api/subscribe it is stored as the contact's
        `locale` property, and a signup without one keeps the stored value.
