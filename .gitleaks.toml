# CI secret scan config (.github/workflows/security.yml). Extends
# gitleaks' own default ruleset rather than replacing it -- see
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
# for what "default" actually checks.
[extend]
useDefault = true

[allowlist]
description = "Known non-secret, intentionally-public identifiers"
regexes = [
]
